<svg width="860" height="300" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="animated data links">
  <defs>
    <style>
      .paper { fill: #fbfaf5; }
      .rule { stroke: #e8e0cf; stroke-width: 1; }
      .ink { fill: #1f2933; }
      .muted { fill: #637076; }
      .line { fill: none; stroke: #87958f; stroke-width: 2; stroke-linecap: square; opacity: .72; }
      .line2 { fill: none; stroke: #c9852b; stroke-width: 2; stroke-linecap: square; opacity: .58; }
      .node { fill: #fbfaf5; stroke: #1f2933; stroke-width: 3; }
      .nodeGreen { fill: #e7f3ee; stroke: #2f7f72; stroke-width: 3; }
      .nodeGold { fill: #fff3d8; stroke: #c9852b; stroke-width: 3; }
      .num { font-family: "Courier New", monospace; font-weight: 700; font-size: 18px; fill: #1f2933; dominant-baseline: middle; text-anchor: middle; }
      .tiny { font-family: "Courier New", monospace; font-size: 13px; fill: #5f6c72; }
      .bit { fill: #2f7f72; }
      .bitGold { fill: #c9852b; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .pulse2 { animation: pulse 3.4s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%, 100% { opacity: .72; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      .ticker text { animation: tick 7s steps(7,end) infinite; }
      @keyframes tick { 0% { transform: translateX(0); } 100% { transform: translateX(-280px); } }
    </style>
    <path id="p1" d="M105 170 C180 90 238 92 312 136 S463 205 548 126 S680 64 748 128"/>
    <path id="p2" d="M145 90 C242 208 345 218 426 170 S553 68 660 205"/>
    <path id="p3" d="M220 236 C296 148 382 106 478 146 S614 224 742 224"/>
  </defs>

  <rect class="paper" width="860" height="300"/>
  <path class="rule" d="M40 48H820 M40 84H820 M40 120H820 M40 156H820 M40 192H820 M40 228H820 M40 264H820 M68 28V272 M104 28V272 M140 28V272 M176 28V272 M212 28V272 M248 28V272 M284 28V272 M320 28V272 M356 28V272 M392 28V272 M428 28V272 M464 28V272 M500 28V272 M536 28V272 M572 28V272 M608 28V272 M644 28V272 M680 28V272 M716 28V272 M752 28V272 M788 28V272"/>
  <rect x="28" y="22" width="804" height="254" fill="none" stroke="#2c3033" stroke-width="3"/>

  <text class="tiny" x="48" y="48">dataset: small signals / useful patterns</text>
  <g class="ticker" transform="translate(548 48)">
    <clipPath id="clip"><rect x="0" y="-16" width="250" height="20"/></clipPath>
    <g clip-path="url(#clip)">
      <text class="tiny" x="0" y="0">01 03 05 08 13 21 34 55 89 144 233</text>
    </g>
  </g>

  <use href="#p1" class="line"/>
  <use href="#p2" class="line2"/>
  <use href="#p3" class="line" opacity=".45"/>

  <circle class="bit" r="6">
    <animateMotion dur="5.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
  </circle>
  <rect class="bitGold" width="10" height="10" x="-5" y="-5">
    <animateMotion dur="7.2s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
  </rect>
  <circle class="bit" r="4" opacity=".78">
    <animateMotion dur="8.4s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion>
  </circle>

  <g class="pulse"><circle class="node" cx="105" cy="170" r="28"/><text class="num" x="105" y="171">01</text></g>
  <g><circle class="nodeGreen" cx="145" cy="90" r="26"/><text class="num" x="145" y="91">08</text></g>
  <g class="pulse2"><circle class="nodeGold" cx="312" cy="136" r="30"/><text class="num" x="312" y="137">21</text></g>
  <g><circle class="node" cx="426" cy="170" r="27"/><text class="num" x="426" y="171">34</text></g>
  <g class="pulse"><circle class="nodeGreen" cx="548" cy="126" r="31"/><text class="num" x="548" y="127">55</text></g>
  <g><circle class="nodeGold" cx="660" cy="205" r="28"/><text class="num" x="660" y="206">89</text></g>
  <g class="pulse2"><circle class="node" cx="748" cy="128" r="29"/><text class="num" x="748" y="129">13</text></g>
  <g><circle class="nodeGreen" cx="742" cy="224" r="25"/><text class="num" x="742" y="225">ML</text></g>
  <g><circle class="nodeGold" cx="220" cy="236" r="22"/><text class="num" x="220" y="237">Σ</text></g>
</svg>
