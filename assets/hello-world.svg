<svg width="860" height="220" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HELLO WORLD pixel banner">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="0" flood-color="#d9d0bd" flood-opacity="0.85"/>
    </filter>
    <style>
      .bg { fill: #fbfaf5; }
      .frame { fill: none; stroke: #2c3033; stroke-width: 4; }
      .grid { stroke: #ebe4d4; stroke-width: 1; }
      .pixel { fill: #1f2933; filter: url(#softShadow); }
      .accent { fill: #2f7f72; }
      .amber { fill: #c9852b; }
      .label { font-family: "Courier New", monospace; font-size: 14px; fill: #5f6c72; }
      .cursor { fill: #2f7f72; animation: blink 1s steps(1,end) infinite; }
      @keyframes blink { 0%, 46% { opacity: 1; } 47%, 100% { opacity: 0; } }
      .scan { animation: scan 4.8s linear infinite; }
      @keyframes scan { 0% { transform: translateY(-90px); opacity: .0; } 18% { opacity: .24; } 82% { opacity: .24; } 100% { transform: translateY(210px); opacity: 0; } }
    </style>
