<svg width="620" height="112" viewBox="0 0 620 112" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pixel cats and dogs walking around">
  <defs>
    <style>
      .ink { fill: #1f2933; }
      .teal { fill: #2f7f72; }
      .amber { fill: #c9852b; }
      .cream { fill: #fbfaf5; }
      .ground { stroke: #ebe4d4; stroke-width: 4; stroke-linecap: square; }
      .pet { transform-box: fill-box; transform-origin: center; }
      .bob-a { animation: bob-a .72s steps(2, end) infinite; }
      .bob-b { animation: bob-b .88s steps(2, end) infinite; }
      .bob-c { animation: bob-c .68s steps(2, end) infinite; }
      .bob-d { animation: bob-d .94s steps(2, end) infinite; }
      @keyframes bob-a { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes bob-b { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes bob-c { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes bob-d { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    </style>
  </defs>

  <line class="ground" x1="34" y1="94" x2="586" y2="94"/>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="18 18; 88 18; 88 18; 182 18; 182 18; 54 18; 54 18; 18 18"
      keyTimes="0; .17; .27; .46; .58; .78; .9; 1"
      dur="13.2s" repeatCount="indefinite"/>
    <g class="pet bob-a">
      <path class="ink" d="M10 16h6v-6h6v6h12v-6h6v6h6v26h-6v8H16v-8h-6z"/>
      <rect class="cream" x="18" y="24" width="4" height="4"/>
