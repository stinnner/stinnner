      <rect class="teal" x="38" y="50" width="4" height="8"/>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="332 20; 432 20; 432 20; 382 20; 382 20; 520 20; 520 20; 332 20"
      keyTimes="0; .16; .25; .39; .49; .72; .84; 1"
      dur="14.4s" begin="-7.3s" repeatCount="indefinite"/>
    <g class="pet bob-c">
      <path class="amber" d="M8 20h8v-8h8v8h10v-8h8v8h8v20h-6v10H14V40H8z"/>
      <rect class="cream" x="18" y="28" width="4" height="4"/>
      <rect class="cream" x="36" y="28" width="4" height="4"/>
      <rect class="ink" x="24" y="38" width="10" height="4"/>
      <rect class="ink" x="28" y="42" width="4" height="4"/>
